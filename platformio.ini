; Spawer Round 1 — RS485 sniffer + Modbus RTU master + LCD test UI
; Deska: Waveshare ESP32-S3-Touch-LCD-7B (16MB flash / 8MB PSRAM)
;
; Poll: H100-101, H1-5 (SP?), H7-23/H13 bits, H500 ~1 s (quiet)
; UI:   H1/SP?/H100/H101/H13 + START(FC16=1) + STOP(FC16=0)
; EXC6 != ERR6. SCAN6 + SCANFC (Serial) + DIFFAULT.
;
; Flash:   pio run -t upload   ← Milan REFLASH (op-test tomorrow)
; Monitor: pio device monitor -e waveshare_esp32s3_lcd7b
;
; USB Serial flags aligned with LG_Therma [env:waveshare-s3-7b]

[env:waveshare_esp32s3_lcd7b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -I src/board

lib_deps =
  lvgl/lvgl@9.2.2

lib_ldf_mode = deep
